name: Publish to PyPI

# Publishes the package when a GitHub Release is published, or on a manual
# workflow_dispatch. Uses PyPI "trusted publishing" (OIDC) so no API token
# needs to be stored as a secret; configure the trusted publisher on PyPI
# first (see PUBLISHING.md).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # The published artifact must be a working tool, not just valid
      # metadata: install the wheel and drive the entry point.
      - name: Smoke-test the built wheel
        run: |
          python -m pip install dist/*.whl
          mx --version
          printf 'a\nb\nc\n' > servers.txt
          mx gen --servers servers.txt --peers 2 --pps 1000 --seed 1
          mx check --nic-gbps 25
          mx help > /dev/null

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/matrix-orchestrator/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-run (or a later Release-triggered run) for an
          # already-published version is a no-op instead of a hard failure.
          skip-existing: true
