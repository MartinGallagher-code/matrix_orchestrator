name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest became 26.04 in November 2026, and setup-python has no 3.9 for it; 24.04 still has every version in the matrix (quarterdeck QD-014 did the same).
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Every version the hosted runners still provide. The declared
        # floor is 3.6, which setup-python can no longer install, so the
        # bottom of the range runs in a container in the python-floor job
        # below; vermin covers 3.7/3.8 statically. 3.14 is the first whose
        # multiprocessing defaults to forkserver on Linux, so the agent's
        # workers are no longer its own children there (MX-007).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # The suite starts real agents on loopback and asserts on achieved
      # packet rates, so it needs nothing installed -- only a network
      # stack and a couple of free UDP ports.
      - name: Run the test suite
        run: ./tests/run_tests.sh

  python-floor:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches stdlib APIs newer than the floor, which a syntax-only
      # compile check cannot see. The agent runs on whatever python3 the
      # fleet has, so this floor is load-bearing.
      - name: Scan for post-3.6 syntax and stdlib APIs
        run: |
          python -m pip install --upgrade vermin
          ./tests/check_python_compat.sh
          # The '-' suffix means "3.6 or later"; a bare --target=3.6 asks
          # for code that needs *exactly* 3.6 and fails on anything older.
          vermin --eval-annotations --violations --target=3.6- \
            matrix_orchestrator/*.py

      # Hosted runners no longer offer a 3.6 toolchain, so use the
      # container. Checkout runs on the host, so there is no node20 issue.
      - name: Run the suite under real Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            bash -euxc './tests/check_python_compat.sh && ./tests/run_tests.sh'

  docs:
    name: docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same invocation Read the Docs runs, with warnings as errors, so a
      # docs break fails the PR here instead of surfacing on RTD later.
      # The CLI reference is generated from the live parsers during this
      # build, so a new flag that would render badly also fails here.
      - name: Build the docs
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # SC1091 only says shellcheck cannot open the sourced helper from
      # its own working directory; following it instead (-x) makes every
      # test function look unreachable, because run_test calls them by
      # name. Excluding the one info-level check is the honest trade.
      - name: Run shellcheck over the test harness
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 tests/*.sh tests/test_helper.bash

  build:
    name: build the wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # A pip install must put a working `mx` on PATH -- that is the
      # documented install path.
      - name: Install the wheel and smoke-test the entry point
        run: |
          python -m pip install dist/*.whl
          mx --version
          printf 'a\nb\nc\n' > servers.txt
          mx gen --servers servers.txt --pps 1000
          mx check --nic-gbps 25
          mx hints > /dev/null

      # Not a failure: a version can sit on main unreleased for a while.
      # But PyPI once fell three releases behind with nothing saying so
      # (MX-002), so say so on every push to main.
      - name: Warn when main's version has no release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' matrix_orchestrator/mx.py)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is tagged"
          else
            echo "::warning::version $v on main has no v$v tag: it has not been released (see PUBLISHING.md)"
          fi

  # Every change moves the version (shared_tools BN-002; the job is
  # shared_tools' templates/version-job.yml). The first step fails when
  # mx.py and pyproject.toml disagree, or CHANGELOG.md does not open with
  # that version, numbered and dated. On a pull request the second fails
  # unless the version is greater than the base branch's; on a push to
  # main the third fails unless it is greater than what main was before
  # the push, which catches two pull requests that took the same number.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD
