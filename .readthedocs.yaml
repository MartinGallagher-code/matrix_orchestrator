#
# Read the Docs configuration (v2). After importing the repo on
# readthedocs.org, no further setup is needed: this file tells RTD how
# to build, and the docs job in ci.yml keeps the build green before it
# ever reaches RTD.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # The build generates the CLI reference from the live parsers; any
  # warning in that pipeline is a real defect, so fail loudly.
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
